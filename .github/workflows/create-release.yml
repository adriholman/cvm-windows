name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
      
      - name: Create release archive
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $tempDir = "cvm-release-$version"
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          
          # Copy files
          Copy-Item -Path "bin/cvm.ps1" -Destination $tempDir
          Copy-Item -Path "bin/composer.ps1" -Destination $tempDir
          Copy-Item -Path "bin/cvm-common.psm1" -Destination $tempDir
          Copy-Item -Path "scripts/setup-path.ps1" -Destination $tempDir
          Copy-Item -Path "LICENSE" -Destination $tempDir
          Copy-Item -Path "NOTICE" -Destination $tempDir
          Copy-Item -Path "VERSION" -Destination $tempDir
          Copy-Item -Path "CHANGELOG.md" -Destination $tempDir
          Copy-Item -Path "README.md" -Destination $tempDir
          
          # Create zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
              (Resolve-Path $tempDir).Path,
              "cvm-release.zip",
              [System.IO.Compression.CompressionLevel]::Optimal,
              $false
          )
          
          # Cleanup
          Remove-Item -Recurse -Force $tempDir
          Write-Output "Release archive created: cvm-release.zip"
      
      - name: Create GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $tag = "${{ steps.version.outputs.TAG }}"
          
          # Create release using GitHub CLI
          gh release create $tag `
            --title "Release $tag" `
            --notes "See CHANGELOG.md for details" `
            cvm-release.zip
